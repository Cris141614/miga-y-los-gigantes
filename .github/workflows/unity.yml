name: Unity

on:
  pull_request:
    paths:
      - 'juego/**'
      - '.github/workflows/unity.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Solo se baja LFS de juego/: los .blend y las referencias gastarian la cuota gratis de LFS
      - name: Lista de archivos LFS
        run: git lfs ls-files -l --include "juego/**" | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull --include "juego/**"

      - uses: actions/cache@v6
        with:
          path: juego/Library
          key: Library-${{ hashFiles('juego/Assets/**', 'juego/Packages/**', 'juego/ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: juego
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados de pruebas
