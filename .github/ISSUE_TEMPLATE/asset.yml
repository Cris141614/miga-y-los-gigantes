name: Asset de arte
description: Personaje, pieza de escenario u objeto que pasa por la pipeline de arte
title: "art: "
body:
  - type: markdown
    attributes:
      value: |
        Cada etapa se aprueba con la lista de su nota en `docs/Produccion/Arte/`. Al aprobarla, pon las capturas en un comentario y marca su casilla. No empieces una etapa sin aprobar la anterior.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Personaje o Guardador (etapas 1 a 7)
        - Objeto grande o pieza de escenario (1 a 5 y 7; la 6 si se mueve)
        - Objeto pequeño (1, 2, 4, 5 y 7)
    validations:
      required: true
  - type: input
    id: nota
    attributes:
      label: Nota de la bóveda
      description: Donde está descrito el asset
      placeholder: docs/Personajes/Miga.md
    validations:
      required: true
  - type: input
    id: limite
    attributes:
      label: Límite de triángulos y texturas
      description: Según docs/Produccion/Arte/Estandares de arte.md
      placeholder: hasta 15 000 triángulos, texturas de 2048 px
  - type: checkboxes
    id: etapas
    attributes:
      label: Etapas aprobadas
      options:
        - label: 1 - Referencias 2D
        - label: 2 - Blockout
        - label: 3 - Esculpido
        - label: 4 - Retopología y UVs
        - label: 5 - Bake y texturas
        - label: 6 - Rig y animación
        - label: 7 - Integración en Unity
